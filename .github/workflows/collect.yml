name: Collect SafeTrade data

on:
  schedule:
    - cron: "7 */2 * * *"   # every 2 hours; about 900 of the 2000 free minutes per month in a private repo
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore previous data (data branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --depth 1 --branch data "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data || mkdir -p data
          rm -rf data/.git

      - name: Collect from the SafeTrade API
        run: python3 collect.py

      - name: Store data on the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd data
          git init --quiet -b data
          git add -A
          git -c user.name="safetrade-radar" -c user.email="safetrade-radar@users.noreply.github.com" commit --quiet -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          rm -rf .git

      - name: Prepare site
        if: ${{ vars.PUBLISH_PAGES == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  pages:
    if: ${{ vars.PUBLISH_PAGES == 'true' }}
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
