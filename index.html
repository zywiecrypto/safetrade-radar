<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SafeTrade Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0c1016; --panel:#141a22; --panel2:#19212b; --ink:#e8edf3; --muted:#93a0ae; --line:#252e3a;
  --accent:#6ea2ff; --accent-soft:#182742; --band:#6ea2ff3d;
  --up:#3fcf8e; --up-soft:#11301f; --warn:#f2b54a; --warn-soft:#3a2c12; --down:#ff7a70; --down-soft:#3b1b19; --idle:#8b96a2; --idle-soft:#222b36;
  --f-body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-display:var(--f-body);
  --f-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body)}
a{color:var(--accent)}
h1,h2,h3{margin:0;font-family:var(--f-display);letter-spacing:-.01em}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
h2{font-size:18px;font-weight:800}h3{font-size:16px;font-weight:800}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dim{color:var(--muted)}.pos{color:var(--up)}.neg{color:var(--down)}
.topbar{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topin{max-width:1280px;margin:0 auto;padding:10px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.01em;color:var(--ink)}
.tabs{display:flex;gap:22px}
.tab{font:600 14px var(--f-body);background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 0;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.grow{flex-grow:1}
input.q,.langsel{font:14px var(--f-body);padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input.q{width:190px}
.wrap{max-width:1280px;margin:0 auto;padding:26px 24px 60px;display:flex;flex-direction:column;gap:24px}
.hero{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.hero p{margin:6px 0 0;color:var(--muted);max-width:68ch}
.hero .meta{font:12px var(--f-mono);color:var(--muted);text-align:right;display:flex;flex-direction:column;gap:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi span{display:block;font-size:13px;color:var(--muted)}
.kpi b{display:block;font:400 26px/1.2 var(--f-mono);margin-top:4px}
.view{display:flex;flex-direction:column;gap:24px}.view[hidden]{display:none}
.sec-head{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sec-head p{margin:0;color:var(--muted);font-size:13px}
.sig{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.sigbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.sigbox ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.sigbox li{display:flex;justify-content:space-between;gap:10px;cursor:pointer;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
.sigbox li b{font-weight:800;font-size:14px}
.sigbox li span{color:var(--muted);text-align:right;min-width:0;overflow-wrap:anywhere;font-family:var(--f-mono);font-size:12px}
.sigbox li:hover b{color:var(--accent)}
.sigbox .none{color:var(--muted);cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card .chips{padding:14px 18px;border-bottom:1px solid var(--line)}
.chips h2{margin-right:8px}
.chip{font:600 13px var(--f-body);border:1px solid var(--line);background:transparent;color:var(--muted);padding:7px 14px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:focus-visible,.chip:focus-visible,.pcard:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1000px;font-size:13px}
th,td{padding:12px 7px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{padding-left:18px}th:last-child,td:last-child{padding-right:18px}
th:nth-child(2),td:nth-child(2){text-align:left}
th{font:700 12px var(--f-body);color:var(--muted);cursor:pointer;user-select:none;background:var(--panel2)}
th[aria-sort]{color:var(--ink)}
td{font-family:var(--f-mono)}
tbody tr{cursor:pointer}tbody tr:hover,tbody tr.sel{background:var(--panel2)}
tbody tr:last-child td{border-bottom:0}
td.sym{font-family:var(--f-body)}td.sym b{font-weight:800;font-size:15px}td.sym span{color:var(--muted);margin-left:3px}
.pill{font:700 12px var(--f-body);padding:3px 10px;border-radius:99px;white-space:nowrap}
.p-up{background:var(--up-soft);color:var(--up)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-down{background:var(--down-soft);color:var(--down)}.p-idle{background:var(--idle-soft);color:var(--idle)}.p-new{background:var(--accent-soft);color:var(--accent)}
.bal{display:inline-block;width:64px;height:8px;border-radius:99px;background:var(--down);overflow:hidden;vertical-align:middle}
.bal i{display:block;height:100%;background:var(--up)}
#detail{background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:16px}
#detail[hidden]{display:none}
.dhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.dhead .t{font-weight:800;font-size:26px;letter-spacing:-.02em;margin-right:8px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px 18px}
.fact span{display:block;font-size:12px;color:var(--muted)}
.fact b{font:400 14px var(--f-mono);font-variant-numeric:tabular-nums}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.chart{min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.chart svg{width:100%;height:auto;display:block}.chart text{font:10px var(--f-mono);fill:var(--muted)}
.note{color:var(--muted);font-size:13px;max-width:90ch;margin:0}
button.x{font:600 13px var(--f-body);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;margin-left:10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
.pcard:hover{border-color:var(--accent)}
.pcard .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pcard .hd b{font-weight:800;font-size:18px}.pcard .hd small{color:var(--muted);margin-left:3px;font-size:14px}
.pcard svg{width:100%;height:auto;display:block}.pcard svg text{font:10px var(--f-mono);fill:var(--muted)}
.pcard .ph{height:120px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;background:var(--bg);border-radius:8px}
.pcard .why{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);align-items:center;margin-top:12px}
.legend i{display:inline-block;width:18px;height:10px;vertical-align:middle;margin-right:5px;border-radius:2px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:22px;color:var(--muted)}
footer{font-size:12px;color:var(--muted);max-width:95ch;line-height:1.6}
@media (max-width:640px){.topin,.wrap{padding-left:16px;padding-right:16px}h1{font-size:24px}.hero .meta{text-align:left}input.q{width:140px}.tabs{order:3;width:100%}}
</style>
</head>
<body>
<div class="topbar"><div class="topin">
  <div class="brand"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11" fill="none" stroke="#6ea2ff" stroke-width="2"/><circle cx="13" cy="13" r="5" fill="none" stroke="#6ea2ff" stroke-width="2"/><line x1="13" y1="13" x2="21" y2="6" stroke="#6ea2ff" stroke-width="2"/></svg>SafeTrade Radar</div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-markets" aria-selected="true" aria-controls="v-markets" data-t="tabMarkets"></button>
    <button class="tab" role="tab" id="t-phases" aria-selected="false" aria-controls="v-phases" data-t="tabPhases"></button>
  </div>
  <div class="grow"></div>
  <input class="q" id="q" type="search" autocomplete="off">
  <select class="langsel" id="lang" aria-label="Language"></select>
</div></div>

<div class="wrap">
  <div class="hero">
    <div>
      <h1 data-t="heroTitle"></h1>
      <p data-t="intro"></p>
    </div>
    <div class="meta"><span id="gen"></span><span data-t="unofficial"></span></div>
  </div>

  <div id="nodata" class="empty" hidden data-t="nodata"></div>

  <section class="kpis" id="kpis"></section>

  <section id="detail" hidden></section>

  <div class="view" id="v-phases" role="tabpanel" hidden>
    <section>
      <div class="sec-head"><h2 data-t="pTitle"></h2><p id="pcnt"></p></div>
      <div class="chips" id="pchips"></div>
      <div class="legend"><span><i style="background:var(--band)"></i><span data-t="lBase"></span></span><span><i style="background:var(--accent);height:10px;width:10px;clip-path:polygon(50% 0,100% 100%,0 100%)"></i><span data-t="lBo"></span></span><span><i style="background:var(--warn);width:10px;border-radius:50%"></i><span data-t="lPeak"></span></span><span><i style="background:var(--ink);width:10px;border-radius:50%"></i><span data-t="lNow"></span></span><span data-t="lNote"></span></div>
    </section>
    <div class="pgrid" id="pgrid"></div>
  </div>

  <div class="view" id="v-markets" role="tabpanel">
    <section>
      <div class="sec-head"><h2 data-t="hlTitle"></h2><p data-t="hlHint"></p></div>
      <div class="pgrid" id="hl"></div>
    </section>
    <section>
      <div class="sec-head"><h2 data-t="sigTitle"></h2><p data-t="sigHint"></p></div>
      <div class="sig" id="sig"></div>
    </section>
    <section class="card">
      <div class="chips" id="chips"></div>
      <div class="tblwrap"><table id="tbl"></table></div>
    </section>
    <p class="note" id="cnt"></p>
  </div>

  <footer data-t="footer"></footer>
</div>

<script src="i18n.js"></script>
<script src="data/data.js"></script>
<script>
let R = window.RADAR; const L = window.RADAR_I18N, $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const st = { tier: "niche", quote: "all", q: "", sort: "vol", dir: -1, active: true, sel: null, view: "markets", pphase: "all", ptier: "niche", pactive: true, lang: "en" };
try { const s = localStorage.getItem("radar-lang"); if (s && L[s]) st.lang = s; else { const n = (navigator.language || "en").slice(0,2).toLowerCase(); if (L[n]) st.lang = n; } } catch(e) {}
const T = (k, v) => { let s = (L[st.lang] && L[st.lang][k]) ?? L.en[k] ?? k; if (v) for (const x in v) s = s.split("{" + x + "}").join(v[x]); return s; };
const loc = () => L[st.lang]._loc;
const nf = (v, o) => v.toLocaleString(loc(), o);
function fP(v){ if (v == null || !isFinite(v) || v === 0) return "—"; const a = Math.abs(v);
  if (a >= 1000) return "$" + nf(v,{maximumFractionDigits:0}); if (a >= 1) return "$" + nf(v,{maximumFractionDigits:2}); if (a >= 0.01) return "$" + nf(v,{maximumFractionDigits:4});
  return "$" + nf(v,{maximumSignificantDigits:3}); }
function fQ(v){ if (v == null || !isFinite(v) || v === 0) return "—"; const a = Math.abs(v); return a >= 1 ? nf(v,{maximumFractionDigits: a >= 100 ? 2 : 4}) : nf(v,{maximumSignificantDigits:4}); }
function fB(v){ if (v == null || !isFinite(v)) return "—"; return "$" + nf(v,{notation:"compact",maximumFractionDigits: Math.abs(v) >= 1000 ? 1 : 0}); }
const sgn = v => (v > 0 ? "+" : "") + nf(v,{maximumFractionDigits:1}) + "%";
const pct = v => v == null || !isFinite(v) ? '<span class="dim">—</span>' : `<span class="${v >= 0 ? "pos" : "neg"}">${sgn(v)}</span>`;
const PH = {breakout:"p-up",uptrend:"p-up",accumulation:"p-warn",post_breakout:"p-warn",consolidation:"p-warn",correction:"p-down","new":"p-new"};
const pill = p => `<span class="pill ${PH[p] || "p-idle"}">${esc(T("ph_" + (PH[p] ? p : "none")))}</span>`;
const pgroup = p => ({breakout:"up",uptrend:"up",accumulation:"acc",post_breakout:"cons",consolidation:"cons",correction:"down","new":"new"})[p] || "other";
const since = m => m.listed || (m.created || "").slice(0,10) || null;
const age = m => since(m) ? Math.floor((Date.now() - Date.parse(since(m))) / 864e5) : null;
const day = t => new Date(t*1000).toISOString().slice(0,10);
const dh = t => new Date(t*1000).toLocaleString(loc(),{day:"2-digit",month:"2-digit",hour:"2-digit"});
function spark(a, w=84, h=22){ a = (a || []).filter(x => x > 0); if (a.length < 3) return ""; const lo = Math.min(...a), hi = Math.max(...a), L0 = Math.log(lo), H = Math.log(hi) - L0 || 1;
  const d = a.map((v,i) => `${i ? "L" : "M"}${(i/(a.length-1)*w).toFixed(1)},${(h-2-(Math.log(v)-L0)/H*(h-4)).toFixed(1)}`).join("");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.3"/></svg>`; }
const offPeak = a => a.dd >= 0 ? T("rAtPeak") : T("rOffPeak",{p: a.dd});

function statics(){
  document.documentElement.lang = st.lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = T(el.dataset.t); });
  $("lang").innerHTML = Object.keys(L).map(k => `<option value="${k}"${k === st.lang ? " selected" : ""}>${esc(L[k]._name)}</option>`).join("");
  $("lang").setAttribute("aria-label", T("lang")); $("q").placeholder = T("fSearch"); $("q").setAttribute("aria-label", T("fSearch"));
  if (R) $("gen").textContent = T("gen",{d: new Date(R.generated).toLocaleString(loc(),{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})});
}
function kpis(){
  const M = R.markets, nu = M.filter(m => age(m) != null && age(m) <= 30).length, br = M.filter(m => m.tier === "niche" && m.vol > 0 && pgroup(m.an.phase) === "up").length;
  $("kpis").innerHTML = [[fB(R.total_vol),"kpiVol"],[M.filter(m => m.vol > 0).length + " / " + M.length,"kpiActive"],[nu,"kpiNew"],[br,"kpiUp"]]
    .map(([b,s],i) => `<div class="kpi"><span>${esc(T(s))}</span><b class="${i === 3 ? "pos" : ""}">${b}</b></div>`).join("");
}
function signals(){
  const M = R.markets.filter(m => m.tier === "niche");
  const box = (k, rows) => `<div class="sigbox"><h3>${esc(T(k))}</h3><div class="lbl">${esc(T(k + "H"))}</div><ul>${rows.length ? rows.slice(0,8).map(([m,t]) => `<li data-id="${m.id}"><b>${esc(m.name)}</b><span>${esc(t)}</span></li>`).join("") : `<li class="none">${esc(T("sigNone"))}</li>`}</ul></div>`;
  const nw = R.markets.filter(m => age(m) != null && age(m) <= 45).sort((a,b) => age(a) - age(b)).map(m => [m, T("rAge",{n: age(m), v: fB(m.vol)})]);
  const vx = M.filter(m => m.volx >= 3 && m.vol >= 5000).sort((a,b) => b.volx - a.volx).map(m => [m, T("rVolx",{x: nf(m.volx), v: fB(m.vol)})]);
  const bo = M.filter(m => m.vol >= 1000 && pgroup(m.an.phase) === "up").sort((a,b) => (b.an.dd ?? -99) - (a.an.dd ?? -99)).map(m => [m, (m.an.multiple ? T("rMult",{x: nf(m.an.multiple)}) : T("rTrend")) + (m.an.dd != null ? " · " + offPeak(m.an) : "")]);
  const ba = M.filter(m => m.an.phase === "accumulation" && m.vol >= 500 && m.an.acc_days >= 20).sort((a,b) => (a.an.tight || 9) - (b.an.tight || 9)).map(m => [m, T("rBase",{n: m.an.acc_days, x: m.an.tight ? nf(m.an.tight) : "?"})]);
  const bp = M.filter(m => m.flow && m.flow.share >= 62 && m.flow.buy + m.flow.sell >= 10000).sort((a,b) => b.flow.share - a.flow.share).map(m => [m, T("rBuy",{p: nf(m.flow.share), v: fB(m.flow.buy + m.flow.sell)})]);
  const dp = M.filter(m => m.depth && m.depth.b2 >= 2000 && m.depth.b2 >= 2 * m.depth.a2).sort((a,b) => b.depth.b2/b.depth.a2 - a.depth.b2/a.depth.a2).map(m => [m, T("rDepth",{b: fB(m.depth.b2), a: fB(m.depth.a2)})]);
  $("sig").innerHTML = box("sNew",nw) + box("sVol",vx) + box("sBo",bo) + box("sTight",ba) + box("sBuy",bp) + box("sDepth",dp);
}
const COLS = [["i","#"],["name","cMarket"],["age","cAge"],["usd","cPrice"],["c24","24h"],["c7","7d"],["c30","30d"],["vol","cVol"],["volx","cVolx"],["spread","cSpread"],["b2","cBids"],["a2","cAsks"],["share","cBuy"],["phase","cPhase"],["spark","cSpark"]];
const val = (m,k) => ({age: age(m), c7: m.an.c7, c30: m.an.c30, spread: m.depth && m.depth.spread, b2: m.depth && m.depth.b2, a2: m.depth && m.depth.a2, share: m.flow && m.flow.share, phase: m.an.phase})[k] ?? m[k];
function table(){
  const quotes = [...new Set(R.markets.map(m => m.quote))];
  $("chips").innerHTML = `<h2>${esc(T("allTitle"))}</h2>` + [["tier","all","fAll"],["tier","niche","fNiche"],["tier","major","fMajor"]].map(([g,k,l]) => `<button class="chip" data-g="${g}" data-k="${k}" aria-pressed="${st[g] === k}">${esc(T(l))}</button>`).join("")
    + `<span class="dim">·</span>` + [["all", T("fAnyQuote")], ...quotes.map(q => [q, q.toUpperCase()])].map(([k,l]) => `<button class="chip" data-g="quote" data-k="${k}" aria-pressed="${st.quote === k}">${esc(l)}</button>`).join("")
    + `<span class="dim">·</span><button class="chip" data-g="active" data-k="x" aria-pressed="${st.active}">${esc(T("fActive"))}</button>`;
  let M = R.markets.filter(m => (st.tier === "all" || m.tier === st.tier) && (st.quote === "all" || m.quote === st.quote) && (!st.active || m.vol > 0) && (!st.q || m.name.toLowerCase().includes(st.q.toLowerCase())));
  const k = st.sort, d = st.dir;
  M.sort((a,b) => { const x = val(a,k), y = val(b,k); if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return (typeof x === "string" ? x.localeCompare(y) : x - y) * d; });
  $("cnt").textContent = T("allCnt",{n: M.length, t: R.markets.length});
  $("tbl").innerHTML = "<thead><tr>" + COLS.map(([c,l]) => `<th data-s="${c}"${c === k ? ` aria-sort="${d < 0 ? "descending" : "ascending"}"` : ""}>${esc(T(l))}${c === k ? (d < 0 ? " ↓" : " ↑") : ""}</th>`).join("") + "</tr></thead><tbody>" +
